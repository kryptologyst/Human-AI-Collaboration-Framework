# Default configuration for Human-AI Collaboration Framework

# Data configuration
data:
  dataset_name: "20newsgroups"
  data_path: "data/"
  tokenizer_name: "distilbert-base-uncased"
  max_length: 512
  test_size: 0.2
  val_size: 0.1
  random_seed: 42

# Model configuration
model:
  name: "distilbert-base-uncased"
  num_classes: 20
  dropout_rate: 0.1
  freeze_encoder: false
  learning_rate: 1e-5
  batch_size: 32
  max_epochs: 10

# Collaboration configuration
collaboration:
  confidence_threshold: 0.8
  feedback_weight: 0.1
  adaptation_rate: 0.05
  min_feedback_samples: 10
  max_feedback_history: 1000

# Explanation configuration
explanation:
  methods: ["SHAP", "LIME", "Attention", "IntegratedGradients"]
  shap:
    background_samples: 100
    max_features: 1000
  lime:
    num_features: 10
    num_samples: 5000
  attention:
    layer_idx: -1
  integrated_gradients:
    n_steps: 50

# Evaluation configuration
evaluation:
  metrics: ["accuracy", "confidence", "faithfulness", "stability", "fairness"]
  save_predictions: true
  save_explanations: true
  evaluation_frequency: 100

# Visualization configuration
visualization:
  style: "seaborn-v0_8"
  save_plots: true
  plot_format: "png"
  dpi: 300
  interactive: true

# Logging configuration
logging:
  level: "INFO"
  log_file: "logs/collaboration.log"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Device configuration
device:
  auto_detect: true
  preferred_device: "cuda"  # cuda, mps, cpu
  fallback_to_cpu: true
